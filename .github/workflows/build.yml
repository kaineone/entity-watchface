name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-4.33.1-py3.13.13-${{ runner.os }}

      - name: Install pebble tool
        run: |
          uv tool install pebble-tool==5.0.40 --python 3.13.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install/activate Pebble SDK
        run: |
          yes | pebble sdk install 4.33.1 || pebble sdk activate 4.33.1
          pebble sdk list

      - name: Build watchface
        run: pebble build

      - name: Run host tests
        run: make -C tests/host

      - name: Run JS tests
        run: node tests/js/test_weather.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: entity-pbw
          path: build/*.pbw
